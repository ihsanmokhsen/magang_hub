<html lang="id">
  <head>

    <meta name="keywords" content="BPAD, magang, NTT, Nusa Tenggara Timur, onboarding magang, Badan Pendapatan Aset Daerah" />
    <meta name="author" content="BPAD Provinsi Nusa Tenggara Timur" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://magang.bpadntt.cloud/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://magang.bpadntt.cloud/" />
    <meta property="og:title" content="BPAD Magang Hub - Ruang Belajar Digital Sobat Magang BPAD NTT" />
    <meta property="og:description" content="Ruang belajar digital untuk Sobat Magang BPAD agar lebih cepat memahami instansi, tugas, budaya kerja, dan istilah penting sebelum mulai berkegiatan." />
    <meta property="og:image" content="https://magang.bpadntt.cloud/logo.png" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="BPAD Magang Hub" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BPAD Magang Hub - Ruang Belajar Digital Sobat Magang BPAD NTT" />
    <meta name="twitter:description" content="Ruang belajar digital untuk Sobat Magang BPAD agar lebih cepat memahami instansi, tugas, budaya kerja, dan istilah penting." />
    <meta name="twitter:image" content="https://magang.bpadntt.cloud/logo.png" />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BPAD Magang Hub",
      "url": "https://magang.bpadntt.cloud",
      "description": "Ruang belajar digital untuk peserta magang BPAD Provinsi Nusa Tenggara Timur.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "inLanguage": "id-ID",
      "provider": {
        "@type": "GovernmentOrganization",
        "name": "BPAD Provinsi Nusa Tenggara Timur",
        "url": "https://bpadntt.cloud"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="./fav.jpg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Langsung ke konten utama</a>
    <main id="main-content" role="main">
      <section id="welcome-screen" class="screen active">
        <div class="hero-glow"></div>
        <div class="hero-content">
          <img class="brand-logo hero-logo" src="./logo.png" alt="Logo BPAD" />
          <p class="eyebrow">BPAD Provinsi Nusa Tenggara Timur</p>
          <h1>Selamat Datang di BPAD Magang Hub</h1>
          <p>
            Ruang belajar digital untuk Sobat Magang BPAD agar lebih cepat memahami
            instansi, tugas, budaya kerja, dan istilah penting sebelum mulai berkegiatan.
          </p>
          <a id="start-btn" href="./dashboard.html" class="btn btn-primary">Mulai</a>
        </div>
      </section>
    </main>
    <div id="page-loader" class="page-loader" aria-hidden="true">
      <div class="loader-stack">
        <img class="loader-logo" src="./logo.png" alt="Logo Pemprov NTT" />
        <div class="spinner" aria-label="Memuat halaman">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p class="loader-text">Memuat dashboard...</p>
      </div>
    </div>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      const startBtn = document.getElementById('start-btn');
      const pageLoader = document.getElementById('page-loader');
      let isNavigating = false;

      if (startBtn && pageLoader) {
        startBtn.addEventListener('click', (event) => {
          if (isNavigating) {
            event.preventDefault();
            return;
          }

          event.preventDefault();
          isNavigating = true;
          pageLoader.classList.add('active');
          document.body.classList.add('loading');

          setTimeout(() => {
            window.location.href = startBtn.href;
          }, 1200);
        });
      }
    </script>
  </body>
</html>
