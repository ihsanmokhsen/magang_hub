<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPAD Magang Hub - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="./fav.jpg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section id="welcome-screen" class="screen active">
        <div class="hero-glow"></div>
        <div class="hero-content">
          <img class="brand-logo hero-logo" src="./logo.png" alt="Logo BPAD" />
          <p class="eyebrow">BPAD Provinsi Nusa Tenggara Timur</p>
          <h1>Selamat Datang di BPAD Magang Hub</h1>
          <p>
            Ruang belajar digital untuk Sobat Magang BPAD agar lebih cepat memahami
            instansi, tugas, budaya kerja, dan istilah penting sebelum mulai berkegiatan.
          </p>
          <a id="start-btn" href="./dashboard.html" class="btn btn-primary">Mulai</a>
        </div>
      </section>
    </main>
    <div id="page-loader" class="page-loader" aria-hidden="true">
      <div class="loader-stack">
        <img class="loader-logo" src="./logo.png" alt="Logo Pemprov NTT" />
        <div class="spinner" aria-label="Memuat halaman">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p class="loader-text">Memuat dashboard...</p>
      </div>
    </div>
    <script>
      const startBtn = document.getElementById('start-btn');
      const pageLoader = document.getElementById('page-loader');
      let isNavigating = false;

      if (startBtn && pageLoader) {
        startBtn.addEventListener('click', (event) => {
          if (isNavigating) {
            event.preventDefault();
            return;
          }

          event.preventDefault();
          isNavigating = true;
          pageLoader.classList.add('active');
          document.body.classList.add('loading');

          setTimeout(() => {
            window.location.href = startBtn.href;
          }, 1200);
        });
      }
    </script>
  </body>
</html>
